services:
  - type: web
    name: bhw-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.13.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: bhw_local
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ADMIN_SETUP_TOKEN
        sync: false
