<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#166f62" />
    <title>Offline · BHW Records</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; color: #18322f; background: #f5f7f4; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.25rem; box-sizing: border-box; }
      main { width: min(100%, 28rem); padding: 2rem; border: 1px solid #dce8e0; border-radius: .8rem; background: #fff; }
      h1 { margin: 0 0 .75rem; font-size: 1.6rem; }
      p { margin: 0; color: #526964; line-height: 1.6; }
      button { margin-top: 1.25rem; min-height: 2.7rem; padding: .6rem 1rem; border: 0; border-radius: .5rem; color: #fff; background: #166f62; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Connect to the internet to sign in and access BHW records. This app does not store child records for offline use.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
